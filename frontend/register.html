<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Create Account | Sam's Driving School UK</title>
  
  <!-- Architectural & Display Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Redirect to Login since candidate accounts are created exclusively by admin -->
  <script>
    window.location.replace('login.html');
  </script>
</head>
<body class="auth-body">

  <!-- Ambient Backdrop Glow -->
  <div class="auth-ambient-glow"></div>

  <!-- Top Navigation Bar -->
  <header class="auth-top-nav">
    <a href="index.html" class="auth-brand" aria-label="Return home">
      sam's<span class="underscore">_</span> <span style="font-size: 0.65em; font-weight: 700; opacity: 0.85;">UK</span>
    </a>
    <a href="index.html" class="auth-back-link">
      <span>&larr;</span> Back to Home
    </a>
  </header>

  <!-- Centered Form Card -->
  <main class="auth-card-container">
    
    <!-- Top Progress Stepper (Exact Match to Screenshot) -->
    <div class="auth-stepper" aria-label="Registration step 1 of 3">
      <div class="step-indicator active" title="Step 1: Account Details">
        <span class="inner-dot"></span>
      </div>
      <div class="step-line"></div>
      <div class="step-indicator" title="Step 2: Driving Preferences">
        <span class="inner-dot"></span>
      </div>
      <div class="step-line"></div>
      <div class="step-indicator" title="Step 3: Verification & Confirmation">
        <span class="inner-dot"></span>
      </div>
    </div>

    <!-- Screen Title -->
    <h1 class="auth-title">CREATE ACCOUNT</h1>

    <!-- Form with Pill Inputs -->
    <form id="registerForm" class="auth-form" novalidate>
      
      <!-- Field 1: Name (Icon matches double horizontal bar in screenshot) -->
      <div class="input-pill-wrap">
        <div class="input-icon">
          <div class="icon-bars" aria-hidden="true">
            <span></span>
            <span></span>
          </div>
        </div>
        <input 
          type="text" 
          id="regName" 
          name="name" 
          class="pill-input" 
          placeholder="Name" 
          autocomplete="name"
          required
        >
      </div>

      <!-- Field 2: Email (Envelope Icon) -->
      <div class="input-pill-wrap">
        <div class="input-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
        </div>
        <input 
          type="email" 
          id="regEmail" 
          name="email" 
          class="pill-input" 
          placeholder="Email" 
          autocomplete="email"
          required
        >
      </div>

      <!-- Field 3: Driving Licence Last 4 Digits -->
      <div class="input-pill-wrap">
        <div class="input-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="5" width="20" height="14" rx="2"></rect>
            <line x1="2" y1="10" x2="22" y2="10"></line>
            <circle cx="6" cy="15" r="1"></circle>
          </svg>
        </div>
        <input 
          type="text" 
          id="regLicence4" 
          name="licenceLast4" 
          class="pill-input" 
          placeholder="Last 4 Digits of Licence (e.g. 8492)" 
          maxlength="4"
          required
        >
      </div>

      <!-- Field 4: Password (Lock Icon) -->
      <div class="input-pill-wrap">
        <div class="input-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <input 
          type="password" 
          id="regPassword" 
          name="password" 
          class="pill-input" 
          placeholder="Password" 
          autocomplete="new-password"
          required
        >
        <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <!-- Action Button "Continue" (Exact Match to Screenshot Pill) -->
      <button type="submit" id="regSubmitBtn" class="btn-auth-continue">
        Continue
      </button>
    </form>

    <!-- Bottom Footer Links -->
    <footer class="auth-footer">
      <a href="#terms" class="auth-footer-link" onclick="alert('By creating an account, you agree to Sam\'s Driving School UK Terms of Service and Privacy Policy.'); return false;">
        Terms &amp; Conditions
      </a>
      <p class="auth-switch-text">
        Already have an account? <a href="login.html" class="auth-switch-link">Sign In</a>
      </p>
    </footer>

  </main>

  <script src="js/auth.js"></script>
</body>
</html>
